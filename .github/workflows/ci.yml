name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the history branch be exercised without inventing a commit, which
  # matters for checking that persistence does not depend on the cache.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; superseded main runs are
  # not. Their matrix jobs have already produced observations, and cancelling
  # the job that files them away would leave a silent hole in the history.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Observations accumulate on a dedicated branch, never on main.
  HISTORY_BRANCH: flakestat-history
  # Must stay "runs.ndjson": flakestat resolves a state directory to that name,
  # which is what lets `compact --dir hist` work on the checkout directly.
  HISTORY_FILE: runs.ndjson

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The parser and runner touch the filesystem and spawn processes, so
        # all three platforms are worth covering.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

      # Each matrix job ingests its own results, on the machine that produced
      # them. An aggregation job that re-ingested downloaded artifacts would
      # stamp its own platform onto all three, which is precisely the false
      # metadata dimension analysis must never see.
      - name: Record observations
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          go build -o "${RUNNER_TEMP}/flakestat" ./cmd/flakestat
          go install gotest.tools/gotestsum@latest

          case "${{ matrix.os }}" in
            ubuntu*)  OS=linux   ;;
            macos*)   OS=darwin  ;;
            windows*) OS=windows ;;
            *)        OS=unknown ;;
          esac

          mkdir -p reports
          # The suite may legitimately fail; the observation is the point.
          gotestsum --junitfile reports/junit.xml --format none -- ./... || true

          # The controlled differential lives behind a build tag so it never
          # runs in the normal suite. Its whole job is to prove the pipeline
          # carries platform context end to end.
          #
          # It is repeated because one execution per platform proves nothing:
          # dimension analysis requires MinGroup observations inside a value and
          # MinOthers outside it, both 10. Twelve per job clears that with room
          # to spare, and gotestsum writes each repetition as its own testcase.
          gotestsum --junitfile reports/platform.xml --format none -- \
            -tags ciplatform -count=12 ./internal/platformcheck/ || true

          "${RUNNER_TEMP}/flakestat" ingest 'reports/*.xml' \
            --dimension "os=${OS}" \
            --dimension "runtime.name=go" \
            --dimension "runtime.version=$(go env GOVERSION)" \
            --commit "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}"

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observations-${{ matrix.os }}
          path: .flakestat/runs.ndjson
          retention-days: 7

  reproduce:
    name: reproduce the validation result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The claim in the README is that anyone can reproduce the ConduitIO
      # before/after in a couple of minutes. If that stops being true - their
      # commits move, the packages are renamed, the script rots - it should
      # fail here rather than in front of the first person who tries it.
      - name: Reproduce, and require the documented flip
        run: |
          set -euo pipefail
          out=$(./scripts/reproduce-validation.sh --runs=12 2>&1)
          echo "$out"
          # Per test, not the aggregate count. The count includes TestRandOld,
          # which fires twice in 300 observations and is meant to read stable;
          # gating on it would make this job flaky about flakiness.
          for t in TestClient_NotFound TestClient_CacheMiss TestClient_CacheHit; do
            echo "$out" | grep -qE "^[[:space:]]*$t[[:space:]]+flaky [0-9.]+[[:space:]]+[0-9]+/[0-9]+[[:space:]]+stable 0\\.00" \
              || { echo "::error::$t no longer flips from flaky to stable across ConduitIO's fix"; exit 1; }
          done

  site:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # sitemap lastmod and the "updated" date on each generated page come
          # from git, so a shallow checkout would silently fall back to today.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # /validation/, /findings/, /design/ and /changelog/ are generated from
      # the Markdown in this repository, so a broken build here means the site
      # and the record have come apart.
      - name: Build
        run: |
          pip install -q -r site/requirements.txt
          python3 site/build.py out

      # A fragment that points at nothing still returns 200 and lands the
      # reader in the wrong place, so checking the page exists is not enough.
      # Three README links and one footer link had already shipped broken.
      - name: Every internal link and fragment must resolve
        run: python3 site/check.py out

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Catches a broken release config on every PR rather than at tag time,
      # when it is far more painful to discover.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,docker

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-binaries
          path: dist/*.tar.gz
          retention-days: 7

  action:
    name: self-test the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The published action installs from GitHub Releases, which do not exist
      # before the first tag. Until then, exercise the real end-to-end flow
      # against a locally built binary.
      - name: Build
        run: go build -o "$RUNNER_TEMP/bin/flakestat" ./cmd/flakestat

      - name: Hunt a known-flaky suite
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          mkdir -p /tmp/selftest/reports && cd /tmp/selftest

          cat > flaky.sh <<'SH'
          #!/bin/sh
          # Fails on even-numbered runs: deterministic flakiness for the test.
          if [ $((FLAKESTAT_RUN % 2)) -eq 0 ]; then
            body='<testcase classname="C" name="test_flaky"><failure message="boom"/></testcase>'
          else
            body='<testcase classname="C" name="test_flaky"/>'
          fi
          printf '<testsuite name="s" tests="2">%s<testcase classname="C" name="test_stable"/></testsuite>' \
            "$body" > "reports/junit-${FLAKESTAT_RUN}.xml"
          SH
          chmod +x flaky.sh

          flakestat hunt --runs 6 --junit 'reports/junit-{run}.xml' --no-color -- ./flaky.sh

          echo "--- asserting test_flaky was caught ---"
          flakestat report --format json | tee out.json
          node -e '
            const r = require("/tmp/selftest/out.json");
            const flaky = r.results.filter(x => x.verdict === "flaky").map(x => x.name);
            if (!flaky.includes("test_flaky")) {
              console.error("FAIL: test_flaky was not detected. Got:", JSON.stringify(r.results));
              process.exit(1);
            }
            if (flaky.includes("test_stable")) {
              console.error("FAIL: test_stable was wrongly flagged flaky");
              process.exit(1);
            }
            console.log("OK: detected", flaky);
          '

      - name: Verify the CI gate exits non-zero
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd /tmp/selftest
          if flakestat report --fail-on-flaky --no-color; then
            echo "FAIL: --fail-on-flaky should have exited non-zero"
            exit 1
          fi
          echo "OK: gate exited non-zero as expected"

  longitudinal:
    name: longitudinal validation
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Two runs must never extend the same append-only history at once.
    # Queued, not cancelled: cancelling a writer discards that run's evidence,
    # and the whole point of the branch is that evidence accumulates.
    concurrency:
      group: flakestat-history-writer
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Download every matrix job's observations
        uses: actions/download-artifact@v4
        with:
          pattern: observations-*
          path: incoming

      # NDJSON is append-only and one observation per line specifically so
      # shards can be concatenated with no merge step and no re-ingestion.
      # Merging preserves the context each job recorded about itself.
      - name: Merge this run's observations
        shell: bash
        run: |
          set -euo pipefail
          find incoming -name runs.ndjson -exec cat {} + > run.ndjson
          echo "merged $(wc -l < run.ndjson) observations from $(find incoming -name runs.ndjson | wc -l) jobs"

      # History lives on its own branch rather than in the working tree.
      # Analysis is unaffected -- every observation already carries the commit
      # and branch it came from -- and development history stays free of
      # telemetry commits that would otherwise trigger this workflow in a loop.
      - name: Fetch accumulated history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .flakestat
          : > history.ndjson
          if git fetch --depth=1 origin "$HISTORY_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:$HISTORY_FILE" > history.ndjson 2>/dev/null \
              || echo "history branch exists but holds no observations yet"
            echo "fetched $(wc -l < history.ndjson) observations recorded by earlier runs"
          else
            echo "no history branch yet; this run starts it"
          fi
          cat history.ndjson run.ndjson > .flakestat/runs.ndjson

      - name: Build flakestat
        run: go build -o /tmp/flakestat ./cmd/flakestat

      # An execution recorded twice is not two executions. Reading already
      # ignores copies, but the file is the durable record here, so they are
      # removed from it rather than skipped on every later read.
      - name: Compact the accumulated history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/flakestat compact
          echo "history now holds $(wc -l < .flakestat/runs.ndjson) observations"

      - name: Verify the pipeline preserved execution context
        shell: bash
        run: |
          set -euo pipefail
          # Every platform that ran must be present, and the aggregation host
          # must not have overwritten any of them.
          for want in linux darwin windows; do
            grep -q "\"os\":\"$want\"" .flakestat/runs.ndjson \
              || { echo "::error::no observations recorded for os=$want"; exit 1; }
          done
          echo "all three platforms survived artifact transport"

          # Branch must be preserved for cross-branch scoring to mean anything.
          grep -q "\"branch\":" .flakestat/runs.ndjson \
            || { echo "::error::branch was not recorded"; exit 1; }

      - name: The controlled differential must be described correctly
        shell: bash
        run: |
          set -euo pipefail
          out=$(/tmp/flakestat explain TestPlatformDifferential --no-color 2>&1 || true)
          echo "$out"

          # It is deterministic on every platform, so it is not flaky. The
          # platform difference belongs in the association, not the verdict.
          echo "$out" | grep -qE "Classification: +stable" \
            || { echo "::error::a deterministic platform difference must not be classified flaky"; exit 1; }

          echo "$out" | grep -q "os=windows" \
            || { echo "::error::expected an association with os=windows"; exit 1; }

          # Correlation, never causation. Which caveat appears depends on how
          # many dimensions happen to be associated, so accept either and then
          # assert the thing that actually matters: no causal claim anywhere.
          echo "$out" | grep -qE "not an established cause|cannot tell which one matters" \
            || { echo "::error::association is missing its correlation caveat"; exit 1; }

          if echo "$out" | grep -qiE "caused by|because of|is responsible for"; then
            echo "::error::association wording implied causation"
            exit 1
          fi

      - name: The healthy suite should stay silent
        shell: bash
        run: |
          set -euo pipefail
          # Silence is the expected and correct result for a healthy matrix.
          # The control test runs on every platform and always passes, so any
          # association for it would be a false positive.
          out=$(/tmp/flakestat explain TestPlatformControl --no-color 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "Where the failures concentrate"; then
            echo "::error::reported an association for a test that never fails"
            exit 1
          fi

          echo "--- full report ---"
          /tmp/flakestat report --no-color --top 20 || true

      # An execution recorded twice must not become two executions. This is
      # the merge path specifically, which never passes through ingest, so
      # nothing but reading enforces it.
      #
      # The direction of the harm is worth stating: a duplicate carries its
      # original's timestamp, sorts beside it and always agrees with itself,
      # so duplication makes a flaky test look stable rather than the reverse.
      - name: Re-collecting the same artifacts must not change the evidence
        shell: bash
        run: |
          set -euo pipefail
          before=$(/tmp/flakestat report --format json)

          # Exactly what collecting one job's artifact twice would produce.
          cat .flakestat/runs.ndjson .flakestat/runs.ndjson > doubled.ndjson
          mv doubled.ndjson .flakestat/runs.ndjson

          after=$(/tmp/flakestat report --format json)
          if [ "$before" != "$after" ]; then
            echo "::error::a duplicated observation log changed the conclusions"
            diff <(echo "$before") <(echo "$after") | head -40 || true
            exit 1
          fi
          echo "duplicated log ($(wc -l < .flakestat/runs.ndjson) lines) produced identical conclusions"

      - name: Report
        shell: bash
        run: /tmp/flakestat ci-report --step-summary --max-rows 20 || true

      # A copy for inspection. The branch is the source of truth; losing this
      # artifact to retention must cost nothing but convenience.
      - name: Publish a snapshot for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakestat-history
          path: .flakestat/runs.ndjson
          retention-days: 30

      # Pull requests read the history but never write it. A fork's token
      # cannot push here anyway, and a PR's observations are not yet part of
      # what main has established.
      - name: Extend the history branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "flakestat"
          git config --global user.email "flakestat@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The concurrency group serializes writers within this workflow, but
          # it cannot speak for anything else that might extend the branch. A
          # rejected push is re-merged against whatever landed first rather
          # than retried blindly, so no run's observations are lost to a race.
          for attempt in 1 2 3 4 5; do
            rm -rf hist && mkdir hist

            if git clone --quiet --branch "$HISTORY_BRANCH" --single-branch --depth 1 "$remote" hist 2>/dev/null; then
              :
            else
              git clone --quiet --depth 1 "$remote" hist
              git -C hist checkout --quiet --orphan "$HISTORY_BRANCH"
              git -C hist rm -rq --cached . 2>/dev/null || true
              find hist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              printf '%s\n' \
                "# flakestat observation history" \
                "" \
                "Written by CI. One JSON object per line, append-only." \
                "Analysis lives in the repository; this branch only stores evidence." \
                > hist/README.md
            fi

            touch "hist/$HISTORY_FILE"
            cat "hist/$HISTORY_FILE" run.ndjson > hist/merged.ndjson
            mv hist/merged.ndjson "hist/$HISTORY_FILE"
            /tmp/flakestat compact --dir hist

            # --porcelain rather than `git diff`, which reports nothing for a
            # file that is not tracked yet -- exactly the case on the first
            # write to a new orphan branch.
            if [ -z "$(git -C hist status --porcelain)" ]; then
              echo "this run added nothing new to the history"
              exit 0
            fi

            git -C hist add -A
            git -C hist commit --quiet -m "observations from ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID})"

            if git -C hist push --quiet origin "$HISTORY_BRANCH" 2>/dev/null; then
              echo "history branch now holds $(wc -l < "hist/$HISTORY_FILE") observations"
              exit 0
            fi

            echo "push rejected; another run extended the branch first, re-merging (attempt $attempt)"
            sleep $(( attempt * 3 ))
          done

          echo "::error::could not extend $HISTORY_BRANCH after 5 attempts"
          exit 1
