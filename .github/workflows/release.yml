name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub Release
  packages: write     # push images to ghcr.io
  id-token: write     # OIDC, for build provenance
  attestations: write # attach SLSA provenance to the release binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from history, so a shallow clone
          # produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release binaries had only an unsigned checksums.txt, while npm and
      # PyPI both ship provenance. This signs what GoReleaser built, so anyone
      # can check where a binary came from:
      #
      #   gh attestation verify flakestat_X_linux_amd64.tar.gz -R rowhitswami/flakestat
      - name: Attest the release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"

          # A personal access token with contents:write on the homebrew-tap
          # repository. GITHUB_TOKEN cannot write to another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing over OIDC: each publish uses a short-lived,
      # workflow-scoped credential instead of a long-lived write token that
      # could leak or need rotating. npm is restricting such tokens anyway.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: npm
        run: |
          # Match the wrapper version to the tag so it resolves the right release.
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: no long-lived API token to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: pypi
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${version}\"/" pyproject.toml
          python -m pip install --upgrade build
          python -m build

      # PyPI uploads are irreversible: a version number cannot be reused even
      # after yanking. v0.1.0 shipped with the wheel metadata at the right
      # version while the code still asked for v0.0.0 binaries, so verify the
      # built wheel actually reports the tag before anything is published.
      - name: Verify the wheel reports the released version
        working-directory: pypi
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          got=$(/tmp/verify/bin/python -c "import flakestat; print(flakestat.__version__)")
          echo "wheel reports: $got, tag is: $version"
          if [ "$got" != "$version" ]; then
            echo "::error::wheel reports $got but the tag is $version; it would download the wrong release"
            exit 1
          fi

      # Pinned to a commit, not the release/v1 branch. A branch ref can be
      # moved under you; this is the tip of release/v1 as of v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi/dist
