name: flakestat
description: Find flaky tests in any language. No SaaS, no account, no data leaving your CI.
author: flakestat contributors

branding:
  # Matches the logo: a blue mark with a pass/fail trend line through it.
  # alert-triangle/red read as "something is broken", which is the wrong
  # message for a tool whose main job is telling you what is not.
  icon: activity
  color: blue

inputs:
  version:
    description: Release tag to install, e.g. v0.1.1. Defaults to the latest release.
    required: false
    default: ""

  args:
    description: >-
      Arguments passed to flakestat, e.g. "ingest 'reports/**/*.xml'" or
      "check --fail-on-new". Leave empty with install-only to just put the
      binary on PATH.
    required: false
    default: ""

  install-only:
    description: Install the binary and add it to PATH without running it.
    required: false
    default: "false"

  summary:
    description: Append a reliability report to the GitHub job summary.
    required: false
    default: "true"

  comment:
    description: >-
      Post the same report as a pull request comment, updating flakestat's
      existing comment rather than adding a new one. Requires
      pull-requests:write and is skipped automatically when unavailable.
    required: false
    default: "false"

  annotations:
    description: >-
      Annotate newly flaky and regressed tests in the diff view, where the test
      framework reported a source file.
    required: false
    default: "false"

  max-rows:
    description: Cap the report's highlight table so large suites stay readable.
    required: false
    default: "20"

  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

  working-directory:
    description: Directory to run in.
    required: false
    default: "."

outputs:
  flaky-count:
    description: Number of tests currently classified as flaky.
    value: ${{ steps.report.outputs.flaky-count }}
  new-flaky-count:
    description: Number of tests newly flaky against the baseline.
    value: ${{ steps.report.outputs.new-flaky-count }}
  report-file:
    description: Path to the generated markdown report.
    value: ${{ steps.report.outputs.report-file }}

runs:
  using: composite

  steps:
    - name: Install flakestat
      shell: bash
      env:
        FG_VERSION: ${{ inputs.version }}
        # Lifts the unauthenticated 60/hour API limit that shared CI runners
        # routinely exhaust when resolving the latest release.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/flakestat-bin"
        sh "${GITHUB_ACTION_PATH}/scripts/install.sh" -b "$dir" ${FG_VERSION:+"$FG_VERSION"}
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run flakestat
      if: inputs.install-only != 'true' && inputs.args != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Arguments go through the environment rather than being interpolated
      # into the script, so untrusted input cannot inject shell commands.
      env:
        FG_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        flakestat $FG_ARGS

    - name: Build the reliability report
      id: report
      if: inputs.install-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FG_SUMMARY: ${{ inputs.summary }}
        FG_ANNOTATIONS: ${{ inputs.annotations }}
        FG_MAX_ROWS: ${{ inputs.max-rows }}
      run: |
        set -euo pipefail

        if [ ! -f .flakestat/runs.ndjson ]; then
          echo "No flakestat history recorded; nothing to report."
          echo "flaky-count=0"     >> "$GITHUB_OUTPUT"
          echo "new-flaky-count=0" >> "$GITHUB_OUTPUT"
          echo "report-file="      >> "$GITHUB_OUTPUT"
          exit 0
        fi

        out="${RUNNER_TEMP}/flakestat-report.md"
        flags=(--o "$out" --max-rows "$FG_MAX_ROWS")
        [ "$FG_SUMMARY" = "true" ]     && flags+=(--step-summary)
        [ "$FG_ANNOTATIONS" = "true" ] && flags+=(--annotations)

        # The binary owns every number here; this step only moves the output
        # around. Annotations reach GitHub by being printed to the log.
        flakestat ci-report "${flags[@]}"

        counts=$(flakestat report --format json 2>/dev/null || echo '{}')
        flaky=$(printf '%s' "$counts" | grep -o '"flaky":[0-9]*' | head -1 | cut -d: -f2)
        echo "flaky-count=${flaky:-0}" >> "$GITHUB_OUTPUT"

        new=$(grep -c '^| .* | New flaky |' "$out" || true)
        echo "new-flaky-count=${new:-0}" >> "$GITHUB_OUTPUT"
        echo "report-file=$out" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.install-only != 'true' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.report.outputs.report-file }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      # Commenting is best-effort on purpose: a fork PR carries a read-only
      # token, and losing a comment must never invalidate the analysis or fail
      # the build. The marker in the report body is what lets a re-run update
      # one comment instead of accumulating them.
      run: |
        set -uo pipefail
        [ -n "$REPORT" ] && [ -f "$REPORT" ] || { echo "No report to post."; exit 0; }

        marker='<!-- flakestat-report -->'
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"$marker\"))] | .[0].id" 2>/dev/null || echo "")

        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
            -F body=@"$REPORT" >/dev/null 2>&1 \
            && echo "Updated the existing flakestat comment." \
            || echo "Could not update the comment; the report is still in the job summary."
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -F body=@"$REPORT" >/dev/null 2>&1 \
            && echo "Posted a flakestat comment." \
            || echo "Could not post a comment (a fork pull request has a read-only token); the report is still in the job summary."
        fi
